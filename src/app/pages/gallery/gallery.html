<div class="container my-4 py-4">
  <div class="text-center mb-5">
    <h2 class="display-6 fw-bold mb-2">Find your new Best Friend</h2>
    <p class="text-muted">Navigate in our gallery with animals ready to adopt and find the perfect companion.</p>
  </div>
</div>

<div class="row justify-content-center mb-5">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body">
        <label class="form-label small fw-semibold text-muted">
          Animal Type
        </label>
        <select class="form-select" [(ngModel)]="selectedType">
          <option value="all">All</option>
          <option value="dog">Cães 🐶</option>
          <option value="cat">Gatos 🐱</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="container mx-auto px-4 mb-9">
  <div class="row g-4">
    @for (animal of filteredAnimals; track animal.id) {
      <div class="col-6 col-md-3">
        <app-card
          [imageUrl]="animal.imageUrl"
          [name]="animal.name"
          [description]="animal.description">
        </app-card>
      </div>
    }
  </div>
</div>
