<div class="container">
  <div class="row">
    @for (card of cards; track card.id) {
      <div class="col-md-4 mt-4">
        <app-card
          [title]="card.title"
          [imageUrl]="card.imageUrl"
          [description]="card.description">
        </app-card>
      </div>
    }
  </div>
</div>
