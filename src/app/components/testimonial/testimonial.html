<div class="card border-0 shadow-sm h-100 p-4"
      style="border-radius: 20px; background-color: #fff; border: 1px solid #f0f0f0 !important;">

  <div class="mb-3 text-start">
    <div class="d-flex align-items-center justify-content-center rounded-circle"
         style="width: 40px; height: 40px; background-color: #e8f5e9;">
      <i class="fas fa-quote-left" style="color: #a3c9b8; font-size: 0.9rem;"></i>
    </div>
  </div>

  <p class="text-muted text-start mb-4" style="font-size: 0.95rem; line-height: 1.6;">
    "{{ message }}"
  </p>

  <div class="d-flex align-items-center mt-auto">
    <img [src]="imageUrl"
         class="rounded-circle me-3"
         style="width: 50px; height: 50px; object-fit: cover;">

    <div class="text-start">
      <h6 class="fw-bold mb-0" style="color: #333; font-size: 1rem;">{{ adopter }}</h6>
      <small class="text-muted" style="font-size: 0.8rem;">Adopted {{ petAdopted }}</small>
    </div>
  </div>
</div>
